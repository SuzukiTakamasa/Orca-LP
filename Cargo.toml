[package]
name = "orca-liquidity-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
solana-client = "1.16"
solana-sdk = "1.16"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.10"
log = "0.4"
anchor-client = "0.28"
anchor-lang = "0.28"
url = "2.4"

# For direct Whirlpool program interaction
spl-token = "4.0"
spl-associated-token-account = "2.2"

# Google Cloud Secret Manager
google-secretmanager1 = "5.0"
yup-oauth2 = "8.3"
hyper = "0.14"
hyper-rustls = "0.24"

# Orca Whirlpool program constants
# Program ID: whirLbMiicVdio4qvUfM5KAg6Ct8VwpYzGff3uctyCc

[dev-dependencies]
proptest = "1.0"
tokio-test = "0.4"

[[bin]]
name = "orca-bot"
path = "src/main.rs"
